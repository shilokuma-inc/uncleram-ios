name: Archive

# main への push で Archive → Export（iOS は IPA、macOS は pkg）まで通ることを確認する（アップロードはしない）。
# develop / release/** は upload.yml が Archive を含むため、ここでは実行しない。
# 必要なときに手動でも確認できるよう workflow_dispatch も置く。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # iOS → macOS の順に 1 つずつ流す。macOS ランナーの同時実行枠（Organization 全体で 5）を 1 つしか使わないため。
  # iOS が失敗しても macOS は流す（!cancelled()）。macOS だけを止めたいときはリポジトリ変数 ENABLE_MACOS_DELIVERY を false にする（Upload と同じ）
  archive:
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: iOS
      upload: false
    secrets: inherit

  archive-macos:
    needs: archive
    if: ${{ !cancelled() && vars.ENABLE_MACOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: macOS
      upload: false
    secrets: inherit
